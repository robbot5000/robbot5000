<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CATEGORY // ROBBOT TECHNOLOGIES</title>

  <!-- Theme: config first, then theme.js (sets colors before first paint) -->
  <script src="config.js"></script>
  <script src="pages.js"></script>
  <script src="theme.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="theme.css">
</head>
<body class="bg-dot-grid min-h-screen flex flex-col justify-between p-4 md:p-8 select-none">

  <header class="max-w-7xl mx-auto w-full mb-6">
    <div class="flex justify-between items-center mb-2">
      <a id="back-link" href="index.html" class="tab t-h3">&lt;= BACK TO MAIN</a>
      <div id="category-badge" class="tab t-h3 is-active" style="cursor: var(--cursor-default)">CATEGORY</div>
    </div>

    <div class="double-border bg-black p-2 md:p-3 relative overflow-hidden">
      <div class="relative w-full h-[280px] sm:h-[360px] bg-neutral-900 overflow-hidden">
        <div id="hero-media" class="absolute inset-0 filter brightness-75 contrast-125"></div>
        <div class="absolute bottom-6 left-6 md:left-10 z-10">
          <h1 id="category-title" class="t-h1 drop-shadow-[0_4px_10px_rgba(0,0,0,0.9)]">CATEGORY</h1>
        </div>
      </div>
    </div>
  </header>

  <!-- Page content: filled by the renderer for this page's type (see PAGE_TYPES) -->
  <main id="content" class="max-w-7xl mx-auto w-full mb-8"></main>

  <footer class="flex flex-col items-center justify-center gap-3 py-4">
    <p class="t-small dim">SYS.PORTFOLIO_V2.0 // ALL RIGHTS RESERVED</p>
  </footer>

  <script src="site.js"></script>
  <script src="gallery.js"></script>
  <script src="blocks.js"></script>
  <script>
    // ---------- Page types ----------
    // Each page in config.js (CATEGORY_DATA) or pages.js (PROJECT_PAGES) has a type:
    //   "project" = grid of project cards (default for categories)
    //   "gallery" = auto-built grid from a folder
    //   "blocks"  = stacked blocks (default for project pages)
    // To add a new type, write a renderer and register it here.
    const PAGE_TYPES = {
      project: renderProjectPage,
      gallery: renderGalleryPage,   // from gallery.js
      blocks: renderBlocksPage      // from blocks.js
    };

    function projectPages() {
      return typeof PROJECT_PAGES !== "undefined" ? PROJECT_PAGES : {};
    }

    // "Tech-Hub" -> "tech-hub", "INTEL ENCORE EXHIBIT" -> "intel-encore-exhibit"
    function slugify(s) {
      return String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    }

    function renderProjectPage(container, data) {
      const pages = projectPages();
      const grid = html('<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6"></div>');

      (data.projects || []).forEach((proj) => {
        // A project opens its own block page if one exists in pages.js, otherwise the quick popup
        const pageKey = proj.page || slugify(proj.title);
        const hasPage = !!pages[pageKey] && !CATEGORY_DATA[pageKey];

        const tag = hasPage ? "a" : "button";
        const attrs = hasPage ? ' href="category.html?type=' + encodeURIComponent(pageKey) + '"' : ' type="button"';
        const card = html(
          "<" + tag + ' class="tech-card"' + attrs + ">" +
            '<div class="flex justify-end mb-[-1px]">' +
              '<h3 class="card-label t-h3 truncate max-w-[85%]">' + esc(proj.title) + '</h3>' +
            '</div>' +
            '<div class="double-border bg-black p-2">' +
              '<div class="card-media w-full h-64 bg-neutral-900 overflow-hidden border border-neutral-800"></div>' +
            '</div>' +
          "</" + tag + ">"
        );
        mountMedia(card.querySelector(".card-media"), proj.image, proj.title,
          "w-full h-full object-cover contrast-125 hover:scale-105 transition-all duration-300");
        if (!hasPage) card.addEventListener("click", () => openModal(proj.title, proj.image, proj.description));
        grid.appendChild(card);
      });
      container.replaceChildren(grid);
    }

    document.addEventListener("DOMContentLoaded", () => {
      // e.g. category.html?type=industrial-design   or   category.html?type=intel-encore-exhibit
      const key = new URLSearchParams(window.location.search).get("type");
      const pages = projectPages();
      const isProjectPage = !!key && !CATEGORY_DATA[key] && !!pages[key];
      const data = isProjectPage ? pages[key] : (key ? CATEGORY_DATA[key] : null);

      if (!data) {
        window.location.href = "index.html";
        return;
      }

      const parentCategory = isProjectPage ? CATEGORY_DATA[data.category] : null;

      document.title = data.title + " // ROBBOT TECHNOLOGIES";
      $("category-title").textContent = data.title;
      mountMedia($("hero-media"), data.heroImage, data.title, "w-full h-full object-cover");

      // BACK: project pages return to their category, categories return to their tab on the main page
      if (parentCategory) {
        $("back-link").href = "category.html?type=" + encodeURIComponent(data.category);
        $("back-link").textContent = "<= BACK TO " + parentCategory.title;
        $("category-badge").textContent = parentCategory.title;
      } else {
        $("back-link").href = "index.html#" + (data.parent || "design");
        $("back-link").textContent = "<= BACK TO MAIN";
        $("category-badge").textContent = isProjectPage ? "PROJECT" : data.title;
      }

      const type = data.type || (isProjectPage ? "blocks" : "project");
      const render = PAGE_TYPES[type] || (isProjectPage ? renderBlocksPage : renderProjectPage);
      render($("content"), data);
    });
  </script>
</body>
</html>
