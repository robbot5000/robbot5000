<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Robbot Technologies: interactive installations, lighting and visuals, industrial design, graphics and renders.">
  <title>ROBBOT TECHNOLOGIES</title>

  <!-- Theme: config first, then theme.js (sets colors before first paint) -->
  <script src="config.js"></script>
  <script src="theme.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="theme.css">
</head>
<body class="bg-dot-grid min-h-screen flex flex-col justify-between p-4 md:p-8 select-none">

  <!-- TOP: tabs + hero cover -->
  <header class="max-w-7xl mx-auto w-full mb-6">
    <nav id="nav" class="flex flex-wrap justify-end gap-1 mb-[-1px] relative z-10" aria-label="Sections"></nav>

    <div class="double-border bg-black p-2 md:p-3 relative overflow-hidden">
      <div id="hero" class="hero relative w-full h-[280px] sm:h-[360px] md:h-[420px] bg-neutral-900 overflow-hidden">
        <div id="hero-media" class="hero-media absolute inset-0"></div>

        <div class="absolute top-4 left-4 border border-white bg-black p-2 w-12 h-12 flex items-center justify-center z-10 shadow-lg">
          <svg class="w-8 h-8 accent-selected animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
          </svg>
        </div>

        <div class="absolute bottom-6 left-6 md:left-10 z-10">
          <h1 id="hero-title" class="t-h1 drop-shadow-[0_4px_10px_rgba(0,0,0,0.9)]">DESIGN</h1>
        </div>

        <div class="absolute inset-0 bg-gradient-to-b from-transparent via-white/5 to-transparent pointer-events-none"></div>
      </div>
    </div>
  </header>

  <!-- TAB CONTENT (filled by renderView) -->
  <main id="view" class="max-w-7xl mx-auto w-full mb-8"></main>

  <footer class="flex flex-col items-center justify-center gap-3 py-4">
    <p class="t-small dim">SYS.PORTFOLIO_V2.0 // ALL RIGHTS RESERVED</p>
  </footer>

  <script src="site.js"></script>
  <script>
    const TAB_KEYS = Object.keys(NAV);
    let currentTab = null;

    // ---------- Tabs ----------
    function buildNav() {
      const nav = $("nav");
      TAB_KEYS.forEach((key) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "nav-tab tab t-h3";
        b.dataset.tab = key;
        b.textContent = NAV[key].label;
        b.addEventListener("click", () => switchTab(key));
        nav.appendChild(b);
      });
    }

    function switchTab(key, opts) {
      opts = opts || {};
      if (!NAV[key]) key = TAB_KEYS[0];
      currentTab = key;
      const tab = NAV[key];

      $("hero-title").textContent = tab.label;
      // The hero can be one image, or a list of images (a slideshow with arrows; heroInterval = auto seconds)
      const heroSrc = SITE_MEDIA[tab.hero];
      mountHero($("hero-media"), heroSrc, tab.label + " cover", tab.heroInterval);
      const heroSlides = Array.isArray(heroSrc) && heroSrc.length > 1;
      $("hero").classList.toggle("clickable", tab.view === "categories" && !heroSlides);

      document.querySelectorAll(".nav-tab").forEach((b) => {
        b.classList.toggle("is-active", b.dataset.tab === key);
      });

      renderView(tab);

      // Remember the tab in the URL so "back" from a category page returns here
      if (opts.updateHash !== false) history.replaceState(null, "", "#" + key);
    }

    function renderView(tab) {
      const view = $("view");
      view.replaceChildren();
      if (tab.view === "categories") view.appendChild(categoriesView(tab));
      else if (tab.view === "bio") view.appendChild(bioView());
      else if (tab.view === "contact") view.appendChild(contactView());
    }

    // ---------- View: grid of category cards (DESIGN, ART / EXPERIMENTS) ----------
    function categoriesView(tab) {
      const grid = html('<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6"></div>');
      tab.categories.forEach((c) => {
        const card = html(
          '<a class="tech-card" href="category.html?type=' + encodeURIComponent(c.key) + '">' +
            '<div class="flex justify-end mb-[-1px]">' +
              '<h3 class="card-label t-h3 text-center max-w-[85%] truncate">' + esc(c.label) + '</h3>' +
            '</div>' +
            '<div class="double-border bg-black p-2">' +
              '<div class="card-media w-full h-64 bg-neutral-900 overflow-hidden border border-neutral-800"></div>' +
            '</div>' +
          '</a>'
        );
        const cls = "w-full h-full object-cover contrast-125 hover:scale-105 transition-all duration-300" +
                    (c.grayscale ? " grayscale hover:grayscale-0" : "");
        mountMedia(card.querySelector(".card-media"), SITE_MEDIA[c.image], c.label, cls);
        grid.appendChild(card);
      });
      return grid;
    }

    // ---------- View: BIO (portrait stays put, profile list scrolls) ----------
    function bioView() {
      const rows = BIO.fields.map((f) =>
        '<div class="bio-row"><dt class="t-h3">' + esc(f.label) + '</dt><dd class="t-body">' + esc(f.value) + '</dd></div>'
      ).join("");

      const links = BIO.links.filter((l) => l.href && l.href.trim()).map((l) =>
        '<a class="tab t-h3" href="' + esc(l.href) + '" target="_blank" rel="noopener">' + esc(l.label) + '</a>'
      ).join("");

      const section = html(
        '<section class="grid grid-cols-1 md:grid-cols-[minmax(0,5fr)_minmax(0,7fr)] gap-4 md:gap-6 items-start">' +
          '<div class="md:sticky md:top-6">' +
            '<div class="flex justify-end mb-[-1px]"><h3 class="card-label t-h3">PORTRAIT</h3></div>' +
            '<div class="double-border bg-black p-2">' +
              '<div id="bio-photo" class="w-full aspect-[4/5] max-h-[calc(100vh-8rem)] bg-neutral-900 overflow-hidden border border-neutral-800"></div>' +
            '</div>' +
          '</div>' +
          '<div>' +
            '<div class="flex justify-end mb-[-1px]"><h3 class="card-label t-h3">PROFILE</h3></div>' +
            '<div class="double-border bg-black p-4 md:p-6">' +
              '<dl>' + rows + '</dl>' +
              (links ? '<div class="flex flex-wrap gap-2 pt-5">' + links + '</div>' : '') +
            '</div>' +
          '</div>' +
        '</section>'
      );
      mountMedia(section.querySelector("#bio-photo"), BIO.photo, "Portrait", "w-full h-full object-cover");
      return section;
    }

    // ---------- View: CONTACT (excerpt + email form) ----------
    function contactView() {
      const topics = CONTACT.topics.map((t) => '<option value="' + esc(t) + '">' + esc(t) + '</option>').join("");

      const section = html(
        '<section class="grid grid-cols-1 md:grid-cols-[minmax(0,5fr)_minmax(0,7fr)] gap-4 md:gap-6 items-start">' +
          '<div>' +
            '<div class="flex justify-end mb-[-1px]"><h3 class="card-label t-h3">OPEN CHANNEL</h3></div>' +
            '<div class="double-border bg-black p-4 md:p-6">' +
              '<p class="t-h2">' + esc(CONTACT.excerpt) + '</p>' +
              '<p class="t-small dim mt-6">DIRECT: <a class="accent-selected underline" href="mailto:' + esc(CONTACT.email) + '">' + esc(CONTACT.email) + '</a></p>' +
            '</div>' +
          '</div>' +
          '<div>' +
            '<div class="flex justify-end mb-[-1px]"><h3 class="card-label t-h3">SEND MESSAGE</h3></div>' +
            '<div class="double-border bg-black p-4 md:p-6">' +
              '<form id="contact-form" class="space-y-4">' +
                '<div><label class="field-label t-small" for="cf-name">NAME</label>' +
                  '<input class="field" id="cf-name" name="name" type="text" autocomplete="name" required></div>' +
                '<div><label class="field-label t-small" for="cf-email">EMAIL</label>' +
                  '<input class="field" id="cf-email" name="email" type="email" autocomplete="email" required></div>' +
                '<div><label class="field-label t-small" for="cf-topic">TOPIC</label>' +
                  '<select class="field" id="cf-topic" name="topic">' + topics + '</select></div>' +
                '<div><label class="field-label t-small" for="cf-message">MESSAGE</label>' +
                  '<textarea class="field" id="cf-message" name="message" rows="6" required></textarea></div>' +
                '<input type="text" name="company" tabindex="-1" autocomplete="off" class="hidden" aria-hidden="true">' +
                '<div class="flex flex-wrap items-center gap-4">' +
                  '<button type="submit" class="tab t-h3">SEND MESSAGE</button>' +
                  '<p id="form-status" class="form-status t-small" role="status"></p>' +
                '</div>' +
              '</form>' +
            '</div>' +
          '</div>' +
        '</section>'
      );
      section.querySelector("#contact-form").addEventListener("submit", submitContact);
      return section;
    }

    async function submitContact(e) {
      e.preventDefault();
      const form = e.target;
      const status = $("form-status");
      const btn = form.querySelector("button[type=submit]");
      const setStatus = (msg, state) => { status.textContent = msg; status.dataset.state = state || ""; };

      if (form.company.value) return; // honeypot: bots fill this, people never see it

      const data = {
        name: form.name.value.trim(),
        email: form.email.value.trim(),
        topic: form.topic.value,
        message: form.message.value.trim()
      };

      const subject = "[" + data.topic + "] from " + data.name;

      // No form service configured yet: open the visitor's email app instead
      if (!CONTACT.endpoint) {
        const body = data.message + "\n\n" + data.name + " <" + data.email + ">";
        window.location.href = "mailto:" + CONTACT.email +
          "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
        setStatus("OPENING YOUR EMAIL APP...", "ok");
        return;
      }

      btn.disabled = true;
      setStatus("SENDING...", "");
      try {
        const res = await fetch(CONTACT.endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          // subject / _subject = the email's subject line (different services read different names)
          body: JSON.stringify(Object.assign({}, CONTACT.extraFields, data, { subject: subject, _subject: subject }))
        });
        let result = null;
        try { result = await res.json(); } catch (e) {}
        if (!res.ok || (result && result.success === false)) throw new Error("send failed");
        form.reset();
        setStatus("MESSAGE SENT. THANKS!", "ok");
      } catch (err) {
        setStatus("SEND FAILED. EMAIL ME DIRECTLY INSTEAD.", "err");
      } finally {
        btn.disabled = false;
      }
    }

    // ---------- Hero click -> modal (only on grid tabs) ----------
    $("hero").addEventListener("click", () => {
      const tab = NAV[currentTab];
      if (!tab || tab.view !== "categories") return;
      let heroSrc = SITE_MEDIA[tab.hero];
      if (Array.isArray(heroSrc)) { if (heroSrc.length > 1) return; heroSrc = heroSrc[0]; }
      openModal(tab.label + " // MAIN HERO VIEW", heroSrc,
        "Primary featured exhibit highlighting overall work in " + tab.label + ".");
    });

    // ---------- Start ----------
    document.addEventListener("DOMContentLoaded", () => {
      buildNav();
      switchTab(location.hash.slice(1), { updateHash: false });
    });
    window.addEventListener("hashchange", () => switchTab(location.hash.slice(1), { updateHash: false }));
  </script>
</body>
</html>
