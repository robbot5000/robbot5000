<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Robbot Technologies: interactive installations, lighting and visuals, industrial design, graphics and renders.">
  <title>ROBBOT TECHNOLOGIES</title>

  <!-- Theme: config first, then theme.js (sets colors before first paint) -->
  <script src="config.js"></script>
  <script src="theme.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="theme.css">
</head>
<body class="bg-dot-grid min-h-screen flex flex-col justify-between p-4 md:p-8 select-none">

  <!-- TOP HEADER / MAIN HERO WINDOW -->
  <header class="max-w-7xl mx-auto w-full mb-6">
    <!-- Top Attached Navigation Tabs -->
    <nav class="flex justify-end gap-1 mb-[-1px] relative z-10" aria-label="Sections">
      <button onclick="switchTab('DESIGN')" class="nav-tab tab t-h3 is-active">DESIGN</button>
      <button onclick="switchTab('ART / EXPERIMENTS')" class="nav-tab tab t-h3">ART / EXPERIMENTS</button>
      <button onclick="switchTab('BIO')" class="nav-tab tab t-h3">BIO</button>
      <button onclick="switchTab('CONTACT')" class="nav-tab tab t-h3">CONTACT</button>
    </nav>

    <!-- Main Hero Display Frame -->
    <div class="double-border bg-black p-2 md:p-3 relative overflow-hidden">
      <div class="relative w-full h-[280px] sm:h-[360px] md:h-[420px] bg-neutral-900 overflow-hidden group clickable" onclick="openHeroModal()">
        <img id="hero-img" data-media="heroDesign" src="" alt="Featured work" class="w-full h-full object-cover filter brightness-75 contrast-125 group-hover:scale-105 transition-transform duration-500">

        <!-- Icon block, top-left -->
        <div class="absolute top-4 left-4 border border-white bg-black p-2 w-12 h-12 flex items-center justify-center z-10 shadow-lg">
          <svg class="w-8 h-8 accent-selected animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
          </svg>
        </div>

        <!-- H1 -->
        <div class="absolute bottom-6 left-6 md:left-10 z-10">
          <h1 id="hero-title" class="t-h1 drop-shadow-[0_4px_10px_rgba(0,0,0,0.9)]">DESIGN</h1>
        </div>

        <div class="absolute inset-0 bg-gradient-to-b from-transparent via-white/5 to-transparent pointer-events-none"></div>
      </div>
    </div>
  </header>

  <!-- CATEGORY CARDS -->
  <main class="max-w-7xl mx-auto w-full grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6 mb-8">

    <a class="tech-card" href="category.html?type=interactive">
      <div class="flex justify-end mb-[-1px]">
        <h3 class="card-label t-h3 text-center max-w-[85%] truncate">INTERACTIVE</h3>
      </div>
      <div class="double-border bg-black p-2">
        <div class="w-full h-64 bg-neutral-900 overflow-hidden relative border border-neutral-800">
          <img data-media="cardInteractive" src="" alt="Interactive" loading="lazy" decoding="async" class="w-full h-full object-cover contrast-125 hover:scale-105 transition-all duration-300">
        </div>
      </div>
    </a>

    <a class="tech-card" href="category.html?type=lighting-visuals">
      <div class="flex justify-end mb-[-1px]">
        <h3 class="card-label t-h3 text-center max-w-[85%] truncate">LIGHTING / VISUALS</h3>
      </div>
      <div class="double-border bg-black p-2">
        <div class="w-full h-64 bg-neutral-900 overflow-hidden relative border border-neutral-800">
          <img data-media="cardLightingVisuals" src="" alt="Lighting / Visuals" loading="lazy" decoding="async" class="w-full h-full object-cover contrast-125 hover:scale-105 transition-all duration-300">
        </div>
      </div>
    </a>

    <a class="tech-card" href="category.html?type=industrial-design">
      <div class="flex justify-end mb-[-1px]">
        <h3 class="card-label t-h3 text-center max-w-[85%] truncate">INDUSTRIAL DESIGN</h3>
      </div>
      <div class="double-border bg-black p-2">
        <div class="w-full h-64 bg-neutral-900 overflow-hidden relative border border-neutral-800">
          <img data-media="cardIndustrialDesign" src="" alt="Industrial Design" loading="lazy" decoding="async" class="w-full h-full object-cover filter grayscale contrast-125 hover:grayscale-0 transition-all duration-300">
        </div>
      </div>
    </a>

    <a class="tech-card" href="category.html?type=graphics-renders">
      <div class="flex justify-end mb-[-1px]">
        <h3 class="card-label t-h3 text-center max-w-[85%] truncate">GRAPHICS / RENDERS</h3>
      </div>
      <div class="double-border bg-black p-2">
        <div class="w-full h-64 bg-neutral-950 flex items-center justify-center relative border border-neutral-800 overflow-hidden">
          <img data-media="cardGraphicsRenders" src="" alt="Graphics / Renders" loading="lazy" decoding="async" class="w-full h-full object-cover filter contrast-125 hover:scale-105 transition-all duration-300">
        </div>
      </div>
    </a>

  </main>

  <!-- FOOTER -->
  <footer class="flex flex-col items-center justify-center gap-3 py-4">
    <div class="diamond" aria-hidden="true"></div>
    <p class="t-small dim">SYS.PORTFOLIO_V2.0 // ALL RIGHTS RESERVED</p>
  </footer>

  <!-- DETAIL MODAL -->
  <div id="modal" onclick="handleBackdropClick(event)" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="double-border bg-black w-full max-w-3xl p-3 relative shadow-2xl">
      <div class="rule-b flex justify-between items-center pb-2 mb-3">
        <div class="flex items-center gap-2">
          <span class="dot-selected w-2 h-2 rounded-full inline-block"></span>
          <h2 id="modal-title" class="t-h2">CATEGORY_TITLE</h2>
        </div>
        <button onclick="closeModal()" class="tab t-h3">[X] CLOSE</button>
      </div>

      <div class="space-y-4">
        <div class="w-full h-64 md:h-80 bg-neutral-900 border border-neutral-800 overflow-hidden">
          <img id="modal-img" src="" alt="Detail view" class="w-full h-full object-cover">
        </div>
        <p id="modal-desc" class="t-body text-neutral-300">Detailed project metadata and description will be loaded here.</p>
        <div class="t-small dim flex justify-between items-center border-t border-neutral-800 pt-2">
          <span>STATUS: ONLINE</span>
          <span>FORMAT: IMAGE/WEBP</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (typeof SITE_MEDIA !== "undefined") applyConfigMedia();
    });

    function applyConfigMedia() {
      document.querySelectorAll("[data-media]").forEach((el) => {
        const path = SITE_MEDIA[el.getAttribute("data-media")];
        if (!path || path.trim() === "") return;
        if (el.tagName === "IMG") {
          el.src = path;
        } else if (el.tagName === "SOURCE") {
          el.src = path;
          el.parentElement.load();
        } else {
          el.style.backgroundImage = `url('${path}')`;
        }
      });
    }

    const TAB_KEYS = {
      'DESIGN': 'heroDesign',
      'ART / EXPERIMENTS': 'heroArtExperiments',
      'BIO': 'heroBio',
      'CONTACT': 'heroContact'
    };

    function switchTab(category) {
      document.getElementById('hero-title').textContent = category;

      const src = SITE_MEDIA[TAB_KEYS[category]];
      if (src) document.getElementById('hero-img').src = src;

      document.querySelectorAll('.nav-tab').forEach((tab) => {
        tab.classList.toggle('is-active', tab.textContent.trim() === category);
      });
    }

    function openModal(title, imgSrc, desc) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-img').src = imgSrc;
      document.getElementById('modal-desc').textContent = desc;
      document.getElementById('modal').classList.remove('hidden');
    }

    function openHeroModal() {
      const title = document.getElementById('hero-title').textContent;
      const imgSrc = document.getElementById('hero-img').src;
      openModal(title + ' // MAIN HERO VIEW', imgSrc, 'Primary featured exhibit highlighting overall work in ' + title + '.');
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
    }

    function handleBackdropClick(e) {
      if (e.target.id === "modal") closeModal();
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });
  </script>
</body>
</html>
